appId: com.snow.loader
productName: SNOW LOADER
copyright: Copyright © 2026 TejHorwDev

# Installers are build artifacts, never committed.
directories:
  output: release
  buildResources: build

# Only the compiled app travels inside the installer — no sources, no tooling.
files:
  - out/**/*
  - '!**/*.map'

asar: true

# The updater does not use electron-builder's feed (it reads its own
# payload.json), but app-update.yml is still written so the build is complete and
# a future switch to electron-updater would not be a rewrite.
publish:
  provider: github
  owner: TejHorwDev
  repo: Snow-Cheats-Client
  releaseType: release

win:
  # A zip as well as an installer: if a machine refuses the NSIS wizard there is
  # still a way to run the app (unzip, run "SNOW LOADER.exe").
  artifactName: SNOW-LOADER-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  oneClick: false
  # Per-user install: no UAC, and an update never needs administrator rights.
  # build/installer.nsh forces current-user so the "all users / only for me"
  # page is skipped rather than shown.
  perMachine: false
  # One language, resolved at build time. A multi-language installer picks a
  # language from the OS at runtime, and a locale it does not know renders every
  # button and label as an empty string — a blank wizard.
  multiLanguageInstaller: false
  installerLanguages:
    - en_US
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SNOW LOADER
  # Downloaded apps and the device identity must survive an uninstall.
  deleteAppDataOnUninstall: false
  artifactName: SNOW-LOADER-Setup-${version}.${ext}
